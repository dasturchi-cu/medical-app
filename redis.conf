# Security Configuration
requirepass redis_secure_pass_2026

# Bind to all interfaces inside the Docker container
bind 0.0.0.0

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence settings
save 900 1
save 300 10
save 60 10000

# Security: rename or disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Client limits
maxclients 10000
