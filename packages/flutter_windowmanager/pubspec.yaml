name: flutter_windowmanager
description: >
  Vendored snapshot of adaptant-labs/flutter_windowmanager (0.2.0) with Android
  AGP 8+ namespace. Used for FLAG_SECURE on PDF reader.
version: 0.2.0+medical.1
publish_to: "none"
homepage: https://github.com/adaptant-labs/flutter_windowmanager

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.adaptant.labs.flutter_windowmanager
        pluginClass: FlutterWindowManagerPlugin
