version: '3.8'

services:
  fastapi:
    build:
      context: ./backend/fastapi
      dockerfile: Dockerfile
    container_name: neuroscience_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:redis_secure_pass_2026@redis:6379/0
    env_file:
      - .env.production
    networks:
      - backend_net
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: neuroscience_redis
    restart: always
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend_net

  admin_panel:
    build:
      context: ./backend/admin_panel
      dockerfile: Dockerfile
    container_name: neuroscience_admin
    restart: always
    env_file:
      - .env.production
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - fastapi

  nginx:
    image: nginx:1.26-alpine
    container_name: neuroscience_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - fastapi
      - admin_panel

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  redis-data:
    driver: local
